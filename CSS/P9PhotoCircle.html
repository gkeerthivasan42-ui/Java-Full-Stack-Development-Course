<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Circle</title>
    <style>
    h1{
        border-color: blueviolet;
        text-align:center;
    }
    #im1
    {
        border-radius:50%;
        border: 15px solid red;
        width: 300px;
        height: auto;
    }
    #im2
    {
        border-radius:20%;
        border: 15px solid blue;
    }
    #im3
    {
        border: 15px solid hotpink;
    }
    </style>
</head>
<body>
    <h1>Profile Photo</h1>
    <img id="im1" src="/CSS/image/profile.jpg">
    <img id="im2" src="/CSS/image/profile.jpg">
    <img id="im3" src="/CSS/image/profile.jpg">   
</body>
</html>
