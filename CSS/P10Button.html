<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <style>
    h1{
        border-color: blueviolet;
        text-align:center;
    }
    button
    {
        font-size: 50px;
        color: red;
        background-color: yellow;
        border-radius: 20px;
    }
    button:hover
    {
        font-size: 55px;
        border: 5px solid red;
        color: yellow;
        background-color: red;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <h1>Button</h1>
    <button>clickme</button>  
</body>
</html>
