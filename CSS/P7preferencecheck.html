<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preference checking</title>
    <style>
        .c1
        {
            background-color: greenyellow; /* !important is used first preference-->*/
        }
        #head1
        {
            background-color: red !important;
        }
    </style>
</head>
<body>
    <h1 style="background-color: blueviolet;" class="C1" id="head1">hi i am keerthi</h1> 
</body>
</html>
