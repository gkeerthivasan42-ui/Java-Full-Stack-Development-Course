<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Bootstrap cards</title>
</head>
<body>
    <h1><center>Card</center></h1>

    <div class="card shadow-lg" style="width: 18rem;">
  <img src="./images.jpg" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">Sony TV</h5>
    <p class="card-text">OLED display<br>64 inch</p>
    <a href="#" class="btn btn-primary">add cart</a>
  </div>
</div>

 <div class="card shadow-sm" style="width: 18rem;">
  <img src="./images.jpg" class="card-img-top" alt="...">
  <div class="card-body bg-success">
    <h5 class="card-title bg-danger">Sony TV</h5>
    <p class="card-text bg-warning">OLED display<br>64 inch</p>
    <a href="#" class="btn btn-primary">add cart</a>
  </div>
</div>
  
  <div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="./images.jpg" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">Redmi TV</h5>
        <p class="card-text">32 inch<br>LCD</p>
        <p class="card-text"><small class="text-body-secondary">Buy now</small></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
