<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Group Buttons</title>
</head>
<body>
    <h1><center>Group Button</center></h1>
    <!-- group: btn-group without gap -->
    <div class="btn-group col-2 d-grid mx-auto">
    <button class="btn btn-outline-success btn-lg">Success</button>
    <button class="btn btn-danger btn-sm">Danger</button>
    <button class="btn btn-info" disabled>Info</button>
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-link">Link</button>
    </div>
    <div class="btn-group col-2 mx-auto">
    <button class="btn btn-outline-success btn-lg">Success</button>
    <button class="btn btn-danger btn-sm">Danger</button>
    <button class="btn btn-info" disabled>Info</button>
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-link">Link</button>
    </div>
</body>
</html>
