<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Bootstrap Buttons Outline</title>
</head>
<body>
    <h1><center>Block Button</center></h1>
    <!-- gap highest 1 to 5 -->
    <!-- col highest 1 to 12 -->
    <!-- mx is a margin harizantol -->
    <div class="d-grid gap-2 col-6 mx-auto">
    <button class="btn btn-outline-success btn-lg">Success</button>
    <button class="btn btn-outline-danger btn-sm">Danger</button>
    <button class="btn btn-outline-info" disabled>Info</button>
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-outline-warning">Warning</button>
    <button class="btn btn-outline-secondary">Secondary</button>
    <button class="btn btn-outline-light">Light</button>
    <button class="btn btn-outline-dark">Dark</button>
    <button class="btn btn-outline-link">Link</button>
    </div>
</body>
</html>
