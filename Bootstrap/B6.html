<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>checkbox and radio</title>
</head>
<body>
    <h1><center>Check Box - multiple selection</center></h1>

    <div class="btn-group">
    <input class="btn-check" type="checkbox" id="cb1">
    <label for="cb1" class="btn btn-outline-info">C Language</label>

    <input class="btn-check" type="checkbox" id="cb2">
    <label for="cb2" class="btn btn-outline-info">C++ Language</label>

    <input class="btn-check" type="checkbox" id="cb3">
    <label for="cb3" class="btn btn-outline-info">Java Language</label>

    <input class="btn-check" type="checkbox" id="cb4">
    <label for="cb4" class="btn btn-outline-info">Python Language</label>
    </div>

    <h1><center>Radio Box - Single selection</center></h1>
    Select Gender:
    <div class="btn-group">

    <input class="btn-check" name="gender" type="radio" id="rb1">
    <label for="rb1" class="btn btn-outline-info">Male</label>

    <input class="btn-check" name="gender" type="radio" id="rb2">
    <label for="rb2" class="btn btn-outline-info">FeMale</label>

    <input class="btn-check" name="gender" type="radio" id="rb3">
    <label for="rb3" class="btn btn-outline-info">Others</label>

    </div>
</body>
</html>
