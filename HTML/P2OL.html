<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1><center>1.Ordered List</center></h1>
    <ol type="1" Start="13">
        <li>January</li>
        <li>February</li>
        <li>March</li>
        <li>April</li>
        <li>May</li>
        <li>June</li>
        <li>July</li>
        <li>August</li>
        <li>September</li>
        <li>October</li>
        <li>November</li> <!--li is used to create a list item in an ordered list. Each month of the year is represented as a list item within the ordered list.-->
        <li>December</li>
    </ol>
</body>
</html>
