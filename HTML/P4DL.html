<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1><center>2.Definition List</center></h1>
    <dl>
        <dt>January</dt> <!--dt difinition title-->
        <dd>The first month of the year.</dd> <!--dd definition description-->
        <hr> <!--horizontal rule-->
        <dt>February</dt>
        <dd>The second month of the year.</dd> 
        <hr size="10" color="blue"> <!--horizontal rule with size and color attributes-->
    </dl>
</body>
</html>
