<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Expression</title>
    <script type="text/javascript">
        function dis(){
            var data=document.getElementById("t1").value;
            var re=/^[A-Z]{1}[ ]{1}[a-z]+$/; // syntax
            if(data.match(re))
            alert("valid");
        else
        alert("invalid format");
        }
    </script>
</head>
<body>
    <h1><center>Regular expression:
        1. first letter should be caps 
        2. second letter should be space
        3.third letter onwards: small + min 1 + max:infinite
    </center></h1>
    <input type="text" id="t1" placeholder="Enter Name"><br>
    <input type="button" value="validate" onclick="dis()"><br>
    <div id="res"></div>
</body>
</html>
