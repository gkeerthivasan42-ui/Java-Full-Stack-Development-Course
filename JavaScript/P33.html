<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Dimentional Array</title>
    <script type="text/javascript">
        function dis(){
            for(var i=1;i<=5;i++)
        {
        for(var j=1;j<=5;j++)
        {
            document.write(" "+i+j);
        }
        document.write("<br>");
    }
}
    </script>
</head>
<body>
    <button onclick="dis()">answer</button>
</body>
</html>
