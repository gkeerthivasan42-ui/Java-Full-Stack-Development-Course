<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <script type="text/javascript">
        function colors()
        {
            document.bgColor=event.target.value;
        }
    </script>
</head>
<body>
    <h1><center>Change Background Color:</center></h1>
    <label>Select A Color: </label><br>
                <input type="radio" onchange="colors()" name="col" value="red">red<br>
                <input type="radio" onchange="colors()" name="col" value="yellow">yellow<br>
                <input type="radio" onchange="colors()" name="col" value="green">green<br>
                <input type="radio" onchange="colors()" name="col" value="blue">blue<br>
    <pre>       <input type="radio" onchange="colors()" name="col" value="orange">orange</pre>

</body>
</html>
