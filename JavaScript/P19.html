<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
    <script type="text/javascript">
        function display(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res="";
            for(var i=n1;i<=n2;i++)
            {
                //document.getElementById(" "+i);
                res=res+i+" ";
            }
            document.getElementById("ans").innerHTML=res;
        }
    </script>
</head>
<body>
    <h1><center>For Loop</center></h1>
    <input type="text" id="t1" placeholder="Enter Starting Number"> <br>
    <input type="text" id="t2" placeholder="Enter Ending Number"> <br>
    <input type="button" value="Show answer" onclick="display()">
    <div id="ans"></div>
</body>
</html>
