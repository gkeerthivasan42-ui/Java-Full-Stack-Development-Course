<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var i=1;
        function showimage()
        {
            if(i==1)
            document.getElementById("myimg").src="./img/GKV.jpg";
            if(i==2)
            document.getElementById("myimg").src="./img/profile.jpg";
            if(i==3)
            document.getElementById("myimg").src="./img/profile2.jpg";
            if(i==4)
            document.getElementById("myimg").src="./img/Nature.jpg";

        i++;
        if(i>=5)
        i=1;

        setTimeout(showimage,50)
        }
    </script>
</head>
<body onload="showimage()">
    <center>
        <img style="border: 10px ridge violet;" id="myimg" src="./img/Nature.jpg">
    </center>
</body>
</html>
