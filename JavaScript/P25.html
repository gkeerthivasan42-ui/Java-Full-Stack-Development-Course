<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumpping Statement</title>
    <script type="text/javascript">
        function show(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            for(var i=n1;i<=n2;i++)
        {
           // if(i>=5)
           // break;
            // ans=ans+i+" ";
            ans=ans+i+" ";
            if(i<=5)
            break;
        }
        document.getElementById("res").innerHTML=ans;
        }
    </script>
</head>
<body>
    <h1>jumping statements 1. continue 2. break</h1>
    <input type="text" id="t1" placeholder="Enter no. 1:"><br>
    <input type="text" id="t2" placeholder="Enter no. 2:"><br>
    <input type="button" value="Break Test" onclick="show()">
    <div id="res"></div>
</body>
</html>
