<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Prime</title>

    <script type="text/javascript">
    function show() {
    var n = parseInt(document.getElementById("t1").value);
    var count = 0;

    for (var i = 1; i <= n; i++) {
        if (n % i == 0) {
            count++;
        }
    }

    if (count == 2)
        document.getElementById("res").innerHTML = "Prime Number";
    else
        document.getElementById("res").innerHTML = "Not Prime Number";
    }
    </script>
</head>

<body>
    <h1><center>Find Prime Number or Not</center></h1>

    <input type="text" id="t1" placeholder="Enter a number"><br>
    <button onclick="show()">Answer</button>
    <div id="res"></div>
</body>
</html>
