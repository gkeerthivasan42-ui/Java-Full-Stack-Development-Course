<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <script type="text/javascript">
        function show(){
            var size=parseInt(document.getElementById("t1").value);
            //var arr=new Array(size);
            var arr=new Array(size);

            for(var i=0;i<size;i++){
                arr[i]=parseInt(prompt("Enter array value at index:"+i));
            }

            for(var i=0;i<size;i++){
                document.write("<br> value "+i+" = "+arr[i]);
            }

            //find highest value
            var big=arr[0];

            for(var i=1;i<size;i++){
                if(big<arr[i])
                big=arr[i];
            }

            document.write("<br>Biggest number:"+big)

            //SUM OF EVEN IN AN ARRAY
            //count of odd numbers
            var esum=0;
            var codd=0;
            for(var i=0;i<size;i++)
            {
                if(arr[i]%2===0)
                esum=esum+arr[i]
                else
                codd++;
            }
            document.write("<br> Sum of even numbers:"+esum);
            document.write("<br>count of odd numbers:"+codd);

            // ascending order
            var temp=0;
            for(i=1;i<size;i++)
            {
                for(j=i+1;j<size;j++)
            {
                if(arr[i]>arr[j])
            {
                temp=arr[i];
                arr[i]=arr[j];
                arr[j]=temp;
            }
            }
            }
            for(i=1;i<size;i++)
            {
                document.write("<br>value "+i+" = "+arr[i]);
            }
        }
    </script>
</head>
<body>
    <h1>Array highest</h1>
    <input type="text" id="t1" placeholder="Enter Array size"><br>
    <button onclick="show()">ANS</button>
</body>
</html>
