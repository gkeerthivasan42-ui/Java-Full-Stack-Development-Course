<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Dimentional Array</title>
    <script type="text/javascript">
        function dis(){
            var n=document.getElementById("t1").value;
            var ans="";
            for(var i=1;i<=n;i++)
            {
            for(var j=1;j<=i;j++)
            {
                document.write(" * ");
            }
            document.write("<br>");
    }
}
    </script>
</head>
<body>
    <h1><center>Star Method</center></h1>
    <input type="text" id="t1" placeholder="Enter a number"><br>
    <button onclick="dis()">nested loop</button>
</body>
</html>
