<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers</title>

    <script>
        function show() {
            var n1 = parseInt(document.getElementById("t1").value);
            var n2 = parseInt(document.getElementById("t2").value);
            var ans = "";

            for (var n = n1; n <= n2; n++) {

                var count = 0;

                for (var i = 1; i <= n; i++) {
                    if (n % i == 0) {
                        count++;
                    }
                }

                if (count == 2) {
                    ans = ans + n + " ";
                }
            }

            document.getElementById("res").innerHTML = ans;
        }
    </script>
</head>

<body>

    <h1>Find Prime Numbers</h1>

    <input type="text" id="t1" placeholder="Enter starting number">
    <br><br>

    <input type="text" id="t2" placeholder="Enter ending number">
    <br><br>

    <button onclick="show()">Answer</button>

    <div id="res"></div>

</body>
</html>
