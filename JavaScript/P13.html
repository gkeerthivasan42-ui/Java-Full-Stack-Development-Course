<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pos Neg Zero</title>
    <script type="text/javascript">
        function find()
        {
            var n=document.getElementById("n1").value;
            var result=document.getElementById("res");
            if(n>0)
            result.innerHTML="<h1>"+n+" is a positive number</h1>";
            else if(n<0)
            result.innerHTML="<h1>"+n+" is a negative number</h1>";
            else
            result.innerHTML="<h1>"+n+" The number is Zero</h1>";
        }
    </script>
</head>
<body>
    <input type="text" id="n1" placeholder="Enter a Number">
    <br>
    <input type="button" value="Answer" onclick="find()">
    <br>
    <div id="res"></div>
</body>
</html>
