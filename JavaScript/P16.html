<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Show and Hide</title>
    <script type="text/javascript">
        function showhide()
        {
            var t=document.getElementById("pw");
            if(t.type==="password")
            {
            t.type="text";
            document.getElementById("myimg").src="./img/eye.png";
            }
            else{
            t.type="password";
            document.getElementById("myimg").src="./img/eyeclose.png";
            }
        }
    </script>
    <style type="text/css">
        #but1
        {
            position: relative;
            left: -110px;
            border:none;
            outline:none;
            background-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input type="password" id="pw" placeholder="Password">
    <button onclick="showhide()" value="showhide">show/hide</button>
    <button id="but1" onclick="showhide()">
        <img id="myimg" src="./img/eyeclose.png" width="10px">
    </button>
    <br>
</body>
</html>
