<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum of digits</title>
    <script type="text/javascript">
        function show(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            var sum=0;
            var i=n1;
            while(i<=n2){
                sum=sum+i;
                if(i==n2)
                ans=ans+i+"";
                else
                ans=ans+i+"+";
                i++;
            }
            document.getElementById("res").innerHTML=ans+" = "+sum;
        }
    </script>
</head>
<body>
    <h1>sum of digits using while loop</h1>

    <input type="text" id="t1" placeholder="Enter starting number">
    <br>
    <input type="text" id="t2" placeholder="Enter ending number">
    <br>
    <button onclick="show()">Answer</button>

    <div id="res"></div>
</body>
</html>
